command: findall
description: Find a keyword or many separated by space in the given filtered files or all files in the current directory. If no keyword is provided, it will start editor to get from user then prompt to confirm the searching.
example: findall function variable in *.c *.h
category: file-search
usage: findall [keyword...] in [filtered file...]
options:
  - name: keyword
    type: string
    description: Keywords to search for (multiple allowed)
    required: true
    examples:
      - "function"
      - "variable"
      - "TODO"
      - "import"
      - "class"
subcommands:
  - in
