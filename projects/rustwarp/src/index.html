<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="styles.css" />
    
    <!-- Prism.js CSS - Dark theme (Local) -->
    <link href="lib/prism/prism.min.css" rel="stylesheet" />
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Terminal App</title>
    
    <!-- Prism.js Core (Local) -->
    <script src="lib/prism/prism.min.js"></script>
    
    <!-- Prism.js Language Components (Local) -->
    <script src="lib/prism/components/prism-javascript.min.js"></script>
    <script src="lib/prism/components/prism-typescript.min.js"></script>
    <script src="lib/prism/components/prism-jsx.min.js"></script>
    <script src="lib/prism/components/prism-tsx.min.js"></script>
    <script src="lib/prism/components/prism-rust.min.js"></script>
    <script src="lib/prism/components/prism-python.min.js"></script>
    <script src="lib/prism/components/prism-java.min.js"></script>
    <script src="lib/prism/components/prism-c.min.js"></script>
    <script src="lib/prism/components/prism-cpp.min.js"></script>
    <script src="lib/prism/components/prism-go.min.js"></script>
    <script src="lib/prism/components/prism-css.min.js"></script>
    <script src="lib/prism/components/prism-json.min.js"></script>
    <script src="lib/prism/components/prism-yaml.min.js"></script>
    <script src="lib/prism/components/prism-markdown.min.js"></script>
    <script src="lib/prism/components/prism-bash.min.js"></script>
    <script src="lib/prism/components/prism-sql.min.js"></script>
    
    <script type="module" src="/main.js" defer></script>
  </head>

  <body>
    <!-- Floating Add View Button -->
    <div class="floating-add-btn" id="floating-add-btn" title="Add new view">
      <span class="plus-icon">+</span>
    </div>
    
    <!-- View Container -->
    <div class="view-container" id="view-container">
      <!-- View 1 - Default Table View -->
      <div class="view-panel active" id="view-1" data-view-id="1">
        <div class="view-header">
          <h2>Terminal View 1</h2>
          <button class="close-view-btn" onclick="closeView(1)" title="Close view">×</button>
        </div>
        
        <div class="view-content">
          <div class="terminal-output" id="terminal-output-1">
            <!-- Terminal rows will be added here dynamically -->
          </div>
          
          <div class="terminal-stats">
            <span>Total entries: <span id="row-count-1" class="row-count">0</span></span>
          </div>
          
          <div class="terminal-input">
            <div class="popup-overlay" id="popup-overlay-1">
              <table class="popup-table">
                <thead>
                  <tr>
                    <th>Command</th>
                    <th>Description</th>
                    <th>Example</th>
                  </tr>
                </thead>
                <tbody id="popup-table-body-1">
                  <!-- Popup rows will be added here dynamically -->
                </tbody>
              </table>
            </div>
            <span class="terminal-prompt">$</span>
            <input 
              id="text-input-1" 
              class="text-input"
              type="text" 
              placeholder="type your command here..." 
              autocomplete="off"
              data-view-id="1"
            />
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
